apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmRepository
metadata:
  name: dashboard
  namespace: monitor
spec:
  interval: 1m
  url: https://kubernetes.github.io/dashboard/
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: dashboard
  namespace: monitor
spec:
  chart:
    spec:
      chart: kubernetes-dashboard
      reconcileStrategy: ChartVersion
      sourceRef:
        kind: HelmRepository
        name: dashboard
      version: '7.14.0'
  interval: 1m
