apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: components
  namespace: flux-system
spec:
  dependsOn:
    - name: infrastructures
  sourceRef:
    kind: GitRepository
    name: flux-system
  path: ./k3s/components
  interval: 10m0s
  wait: true
  timeout: 5m0s
  prune: true
