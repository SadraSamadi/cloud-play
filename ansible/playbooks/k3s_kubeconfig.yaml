- name: Fetch K3s kubeconfig for local kubectl access
  hosts: shuttle
  become: yes

  vars:
    kubeconfig_remote_file: /etc/rancher/k3s/k3s.yaml
    kubeconfig_local_dir: "{{ lookup('env', 'HOME') }}/.kube"
    kube_api_server: "https://{{ ansible_host }}:6443"

  tasks:

    - name: Read kubeconfig from VPS
      ansible.builtin.slurp:
        src: "{{ kubeconfig_remote_file }}"
      register: kubeconfig_raw

    - name: Decode and update kubeconfig server address
      ansible.builtin.set_fact:
        kubeconfig_fixed: >-
          {{
            kubeconfig_raw['content']
            | b64decode
            | regex_replace('https://127.0.0.1:6443', kube_api_server)
          }}

    - name: Ensure local .kube directory exists
      delegate_to: localhost
      become: no
      ansible.builtin.file:
        path: "{{ kubeconfig_local_dir }}"
        state: directory
        mode: '0755'

    - name: Write kubeconfig to local machine
      delegate_to: localhost
      become: no
      ansible.builtin.copy:
        content: "{{ kubeconfig_fixed }}"
        dest: "{{ kubeconfig_local_dir }}/shuttle.yaml"
        mode: '0600'
