- name: Install and configure Docker
  hosts: shuttle
  become: yes

  vars_files:
    - ../vars.yaml

  vars:
    download_dir: /tmp/docker-packages
    package_mirror: https://mirrors.aliyun.com/docker-ce/linux/ubuntu/dists
    packages:
      - containerd.io_2.2.1-1
      - docker-ce-cli_29.1.3-1
      - docker-ce_29.1.3-1
      - docker-buildx-plugin_0.30.1-1
      - docker-compose-plugin_5.0.0-1

  tasks:

    - name: Collect OS info
      ansible.builtin.set_fact:
        os: "{{ ansible_distribution | lower }}.{{ ansible_distribution_version }}"
        dist: "{{ ansible_distribution_release | lower }}"
        arch: "{{ 'amd64' if ansible_architecture == 'x86_64' else ansible_architecture }}"

    - name: Create download directory
      ansible.builtin.file:
        path: "{{ download_dir }}"
        state: directory
        mode: '0755'

    - name: Download Docker packages
      ansible.builtin.get_url:
        url: "{{ package_mirror }}/{{ dist }}/pool/stable/{{ arch }}/{{ item }}~{{ os }}~{{ dist }}_{{ arch }}.deb"
        dest: "{{ download_dir }}/{{ item }}~{{ os }}~{{ dist }}_{{ arch }}.deb"
        mode: '0644'
      loop: "{{ packages }}"

    - name: Install Docker packages
      ansible.builtin.apt:
        deb: "{{ download_dir }}/{{ item }}~{{ os }}~{{ dist }}_{{ arch }}.deb"
      loop: "{{ packages }}"

    - name: Ensure Docker service is running
      ansible.builtin.service:
        name: docker
        state: started
        enabled: yes

    - name: Configure Docker registry mirror
      ansible.builtin.copy:
        dest: /etc/docker/daemon.json
        mode: '0644'
        content: |
          {
            "insecure-registries": ["{{ registry_mirror }}"],
            "registry-mirrors": ["{{ registry_mirror }}"]
          }
      notify: Restart Docker

  handlers:
    - name: Restart Docker
      ansible.builtin.service:
        name: docker
        state: restarted
