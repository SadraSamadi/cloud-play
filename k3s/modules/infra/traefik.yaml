apiVersion: helm.cattle.io/v1
kind: HelmChartConfig
metadata:
  name: traefik
  namespace: kube-system
spec:
  valuesContent: |-
    certificatesResolvers:
      letsencrypt:
        acme:
          email: info@shuttle.sadra.xyz
          storage: /data/acme.json
          httpChallenge:
            entryPoint: web
    persistence:
      enabled: true
      size: 1Gi
    ports:
      postgres:
        port: 5432
        expose:
          default: true
      redis:
        port: 6379
        expose:
          default: true
