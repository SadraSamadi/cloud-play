apiVersion: v1
kind: Namespace
metadata:
  name: strimzi-system
---
apiVersion: source.toolkit.fluxcd.io/v1
kind: OCIRepository
metadata:
  name: strimzi
  namespace: strimzi-system
spec:
  interval: 24h
  url: oci://quay.io/strimzi-helm/strimzi-kafka-operator
  ref:
    tag: '0.35.0'
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: strimzi
  namespace: strimzi-system
spec:
  chartRef:
    kind: OCIRepository
    name: strimzi
  interval: 24h
  values: { }
