apiVersion: source.toolkit.fluxcd.io/v1
kind: OCIRepository
metadata:
  name: prometheus-stack
  namespace: monitor
spec:
  interval: 1m
  url: oci://ghcr.io/prometheus-community/charts/kube-prometheus-stack
  ref:
    tag: '80.9.2'
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: prometheus-stack
  namespace: monitor
spec:
  chartRef:
    kind: OCIRepository
    name: prometheus-stack
  interval: 1m
  values:
    global:
      imageRegistry: docker.arvancloud.ir
