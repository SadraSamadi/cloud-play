apiVersion: batch/v1
kind: Job
metadata:
  name: test
  namespace: dev
  annotations:
    kustomize.toolkit.fluxcd.io/force: Enabled
spec:
  template:
    spec:
      containers:
        - name: test
          image: curlimages/curl
          command: [ "sh", "-c", "curl \"http://backend.dev.svc.cluster.local?n=3&ts=$(date +%s)\"" ]
      restartPolicy: Never
  backoffLimit: 3
