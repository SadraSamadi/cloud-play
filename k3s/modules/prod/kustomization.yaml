apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: prod
resources:
  - namespace.yaml
  - image-update-automation.yaml
  - ../../components/postgres-db
  - ../../components/redis
  - ../../components/backend
  - ../../components/frontend
images:
  - name: sadrasamadi/shuttle-backend
    newTag: latest
    digest: sha256:451f0413f27652340282463601245d919f50ff406f73ee5d9dd9b08e5312634f # {"$imagepolicy": "prod:backend:digest"}
  - name: sadrasamadi/shuttle-frontend
    newTag: latest
    digest: sha256:631a8e8a3a6533d4fdc1810c019be708cfad4cf2c88ff7d7ef54d58be33d7f79 # {"$imagepolicy": "prod:frontend:digest"}
patches:
  - target:
      kind: IngressRouteTCP
      name: redis
    patch: |
      - op: replace
        path: /spec/routes/0/match
        value: HostSNI(`redis.shuttle.sadra.xyz`)
  - path: backend.secret.yaml
  - target:
      kind: IngressRoute
      name: backend
    patch: |
      - op: replace
        path: /spec/routes/0/match
        value: Host(`api.shuttle.sadra.xyz`)
  - path: frontend.config-map.yaml
  - target:
      kind: IngressRoute
      name: frontend
    patch: |
      - op: replace
        path: /spec/routes/0/match
        value: Host(`app.shuttle.sadra.xyz`)
