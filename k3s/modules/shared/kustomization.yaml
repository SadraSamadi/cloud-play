apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: shared
resources:
  - namespace.yaml
  - ../../components/postgres-cluster
  - ../../components/ceph
patches:
  - target:
      kind: IngressRouteTCP
      name: postgres
    patch: |
      - op: replace
        path: /spec/routes/0/match
        value: HostSNI(`shared.postgres.shuttle.sadra.xyz`)
