apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: dev
resources:
  - namespace.yaml
  - ../../components/postgres-db
  - ../../components/redis
  - ../../components/backend
  - ../../components/frontend
patches:
  - target:
      kind: IngressRouteTCP
      name: redis
    patch: |
      - op: replace
        path: /spec/routes/0/match
        value: HostSNI(`dev.redis.shuttle.sadra.xyz`)
  - path: backend.secret.yaml
  - target:
      kind: IngressRoute
      name: backend
    patch: |
      - op: replace
        path: /spec/routes/0/match
        value: Host(`dev.api.shuttle.sadra.xyz`)
  - path: frontend.config-map.yaml
  - target:
      kind: IngressRoute
      name: frontend
    patch: |
      - op: replace
        path: /spec/routes/0/match
        value: Host(`dev.app.shuttle.sadra.xyz`)
