apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: redis
  namespace: shared
spec:
  chartRef:
    kind: OCIRepository
    name: redis
  interval: 1m0s
  values:
    global:
      security:
        allowInsecureImages: true
      imageRegistry: docker.arvancloud.ir
    architecture: standalone
    auth:
      existingSecret: redis
      existingSecretPasswordKey: password
    master:
      persistence:
        enabled: false
