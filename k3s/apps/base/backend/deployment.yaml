apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  namespace: shared
spec:
  replicas: 1
  selector:
    matchLabels:
      app: backend
  template:
    metadata:
      name: backend
      labels:
        app: backend
    spec:
      containers:
        - name: backend
          image: sadrasamadi/shuttle-backend:latest@sha256:252075e2d5970c202b3a5cb17d1cd98275c08eb858cc09dd22f9f83880e3b5cf # {"$imagepolicy": "shared:backend"}
          imagePullPolicy: Always
          env:
            - name: POSTGRES
              valueFrom:
                secretKeyRef:
                  name: backend
                  key: postgres_url
            - name: REDIS
              valueFrom:
                secretKeyRef:
                  name: backend
                  key: redis_url
          ports:
            - containerPort: 8080
              protocol: TCP
      restartPolicy: Always
