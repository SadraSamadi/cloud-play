apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: infisical
  namespace: infisical
spec:
  chart:
    spec:
      chart: infisical-standalone
      reconcileStrategy: ChartVersion
      sourceRef:
        kind: HelmRepository
        name: infisical
      version: '1.7.2'
  interval: 1m0s
  values:
    postgresql:
      enabled: false
    redis:
      enabled: false
    ingress:
      enabled: false
      nginx:
        enabled: false
