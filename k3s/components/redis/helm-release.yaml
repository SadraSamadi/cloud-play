apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: redis
  namespace: shuttle
spec:
  chart:
    spec:
      chart: redis
      reconcileStrategy: ChartVersion
      sourceRef:
        kind: HelmRepository
        name: bitnami
      version: '24.1.0'
  interval: 1m0s
  values:
    architecture: standalone
    auth:
      existingSecret: redis
      existingSecretPasswordKey: password
    master:
      persistence:
        enabled: false
