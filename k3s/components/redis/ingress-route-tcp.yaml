apiVersion: traefik.io/v1alpha1
kind: IngressRouteTCP
metadata:
  name: redis
  namespace: shuttle
spec:
  entryPoints:
    - websecure
  routes:
    - match: HostSNI(`redis.shuttle.sadra.xyz`)
      services:
        - name: redis-master
          port: 6379
  tls:
    passthrough: true
#    certResolver: le
