apiVersion: traefik.io/v1alpha1
kind: IngressRouteTCP
metadata:
  name: redis
  namespace: default
spec:
  entryPoints:
    - redis
  routes:
    - match: HostSNI(`default.redis.shuttle.sadra.xyz`)
      services:
        - name: redis-master
          port: 6379
  tls:
    certResolver: letsencrypt
