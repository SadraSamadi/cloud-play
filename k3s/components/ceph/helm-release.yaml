apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: ceph
  namespace: default
spec:
  chart:
    spec:
      chart: rook-ceph-cluster
      reconcileStrategy: ChartVersion
      sourceRef:
        kind: HelmRepository
        name: rook
        namespace: rook-ceph
      version: '1.18.8'
  interval: 1m
  values:
    operatorNamespace: rook-ceph
