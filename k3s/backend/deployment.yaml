apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  namespace: shuttle
  labels:
    app: backend
spec:
  replicas: 3
  selector:
    matchLabels:
      app: backend
  template:
    metadata:
      name: backend
      labels:
        app: backend
    spec:
      containers:
        - name: backend
          image: sadrasamadi/shuttle-backend:9f88a1d15cc65b1622877161a00458fca7560564
          imagePullPolicy: Always
          env:
            - name: DB_URL
              valueFrom:
                secretKeyRef:
                  name: backend
                  key: DB_URL
          ports:
            - containerPort: 8080
              protocol: TCP
      restartPolicy: Always
