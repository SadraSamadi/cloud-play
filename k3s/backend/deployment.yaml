apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  namespace: shuttle
spec:
  replicas: 3
  selector:
    matchLabels:
      app: backend
  template:
    metadata:
      name: backend
      labels:
        app: backend
    spec:
      containers:
        - name: backend
          image: sadrasamadi/shuttle-backend:latest@sha256:5bafe5a6b37e7515589332dc66f0bd66dd529796e32342e35ab303f525b9e72c # {"$imagepolicy": "shuttle:backend"}
          imagePullPolicy: IfNotPresent
          env:
            - name: DB_URL
              valueFrom:
                secretKeyRef:
                  name: backend
                  key: DB_URL
          ports:
            - containerPort: 8080
              protocol: TCP
      restartPolicy: Always
