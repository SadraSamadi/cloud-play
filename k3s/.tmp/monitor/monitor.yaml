apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: monitor
  namespace: flux-system
spec:
  dependsOn:
    - name: infra
  sourceRef:
    kind: GitRepository
    name: flux-system
  path: ./k3s/modules/monitor
  interval: 10m0s
  wait: true
  timeout: 5m0s
  prune: true
