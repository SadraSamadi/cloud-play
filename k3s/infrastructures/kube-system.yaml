apiVersion: helm.cattle.io/v1
kind: HelmChartConfig
metadata:
  name: traefik
  namespace: kube-system
spec:
  valuesContent: |-
    additionalArguments:
      - "--certificatesresolvers.le.acme.email=info@shuttle.sadra.xyz"
      - "--certificatesresolvers.le.acme.storage=/data/acme.json"
      - "--certificatesresolvers.le.acme.httpchallenge.entrypoint=web"
    persistence:
      enabled: true
    ports:
      postgres:
        port: ':5432'
      redis:
        port: ':6379'
    ingressRoute:
      dashboard:
        enabled: true
        matchRule: Host(`traefik.shuttle.sadra.xyz`)
        entryPoints: ["websecure"]
